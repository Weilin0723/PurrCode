[workspace]
members = [
  "crates/runtime-core",
  "crates/pawgate-runtime",
  "crates/contextual-judgment",
  "crates/ninelives-recovery",
  "crates/claw-sandbox",
  "crates/terminal-runtime",
  "crates/provider-gateway",
  "crates/provider-import",
  "crates/repository-engine",
  "crates/whisker-context-engine",
  "crates/codex-bridge",
  "crates/mcp-host",
  "crates/supervisor-runtime",
  "crates/validation-runtime",
  "crates/agent-runtime",
  "crates/purrcode-daemon",
  "crates/purrcode-cli",
  "crates/purrcode-tui",
  "crates/purrcode-tui-e2e",
  "crates/purrcode-ide",
  "crates/skill-store",
  "crates/skill-registry",
  "crates/web-research",
  "crates/reference-resolver",
  "crates/golden-suite",
  "crates/evaluation-runtime",
  "crates/evidence-bundle",
  "crates/workspace-contracts",
  "crates/environment-runtime",
  "crates/authority-contracts",
  "crates/model-selection",
  "crates/ui-contracts",
  "crates/studio-shell",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Weilin0723/PurrCode"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
blake3 = "1"
cap-std = "4"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
ed25519-dalek = "3"
futures = "0.3"
eventsource-stream = "0.2"
globset = "0.4"
ignore = "0.4"
keyring = "4.1.5"
libc = "0.2"
portable-pty = "0.9"
hex = "0.4"
security-framework = "3.7"
rusqlite = { version = "0.32", features = ["backup", "bundled", "chrono", "uuid"] }
rfd = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ratatui = "0.30"
regex = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
vt100 = "0.16"
rpassword = "7.5.4"
schemars = { version = "0.8", features = ["uuid1", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
sha2 = "0.10"
sysinfo = "0.38.4"
tempfile = "3"
textwrap = "0.16"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "io-util", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
