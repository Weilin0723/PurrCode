name: Signed release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  build:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --workspace
      - run: cargo build --release --locked --target ${{ matrix.target }} -p purrcode-cli -p purrcode-daemon
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "purrcode-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/purrcode" "purrcode-${{ matrix.target }}/"
          cp "target/${{ matrix.target }}/release/purrcoded" "purrcode-${{ matrix.target }}/"
          cp README.md LICENSE* "purrcode-${{ matrix.target }}/" 2>/dev/null || true
          tar -czf "purrcode-${{ matrix.target }}.tar.gz" "purrcode-${{ matrix.target }}"
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory "purrcode-${{ matrix.target }}"
          Copy-Item "target/${{ matrix.target }}/release/purrcode.exe" "purrcode-${{ matrix.target }}/"
          Copy-Item "target/${{ matrix.target }}/release/purrcoded.exe" "purrcode-${{ matrix.target }}/"
          Copy-Item README.md "purrcode-${{ matrix.target }}/"
          Copy-Item LICENSE "purrcode-${{ matrix.target }}/"
          Compress-Archive "purrcode-${{ matrix.target }}" "purrcode-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: purrcode-${{ matrix.target }}
          path: purrcode-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: purrcode-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin launcher checksums to this release's native archives
        run: node packages/purrcode/scripts/write-checksums.js dist
      - name: Package npm-compatible launcher
        run: |
          packed_name="$(npm pack ./packages/purrcode --ignore-scripts --pack-destination dist)"
          mv "dist/${packed_name}" "dist/purrcode-${GITHUB_REF_NAME#v}.tgz"
      - name: Create checksum manifest
        working-directory: dist
        run: sha256sum purrcode-* > SHA256SUMS
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign every artifact with GitHub OIDC
        working-directory: dist
        run: |
          for artifact in purrcode-* SHA256SUMS; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
