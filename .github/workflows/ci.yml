name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - name: Test workspace with real PTY integration
        if: runner.os != 'Windows'
        run: cargo test --workspace --no-fail-fast
      - name: Test Windows workspace without the external ConPTY execution gate
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude purrcode-tui-e2e --no-fail-fast
      - name: Test Windows e2e harness library
        if: runner.os == 'Windows'
        run: cargo test -p purrcode-tui-e2e --lib

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
      - run: npm ci --prefix sdk/typescript
      - run: npm test --prefix sdk/typescript
      - run: npm test --prefix packages/purrcode
      - run: npm pack ./packages/purrcode --ignore-scripts --dry-run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
