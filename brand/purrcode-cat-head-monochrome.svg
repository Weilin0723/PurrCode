<!-- PurrCode cat-head icon (monochrome) for dark/light surfaces -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="currentColor">
  <!-- Same cat head in monochrome -->
  <ellipse cx="16" cy="16" rx="12" ry="11" fill="currentColor" opacity="0.9"/>
  <!-- Ear left -->
  <polygon points="6,7 3,0 11,4" fill="currentColor" opacity="0.9"/>
  <!-- Ear right -->
  <polygon points="26,7 29,0 21,4" fill="currentColor" opacity="0.9"/>
  <!-- Eyes (cutout) -->
  <ellipse cx="11" cy="14" rx="3" ry="3" fill="white" opacity="0.85"/>
  <ellipse cx="21" cy="14" rx="3" ry="3" fill="white" opacity="0.85"/>
  <ellipse cx="11" cy="14" rx="1.8" ry="2.2" fill="#1a1a2e" opacity="0.9"/>
  <ellipse cx="21" cy="14" rx="1.8" ry="2.2" fill="#1a1a2e" opacity="0.9"/>
  <!-- Nose cutout -->
  <ellipse cx="16" cy="20" rx="1" ry="0.7" fill="white" opacity="0.7"/>
  <!-- Collar cutout -->
  <path d="M8,26 Q16,30 24,26" fill="none" stroke="white" stroke-width="1.3" opacity="0.7"/>
</svg>